[package]
name = "vrc-pc-status"
version = "2.0.0"
edition = "2024"
rust-version = "1.98"
description = "Shows this PC's status in the VRChat chat box over OSC"

[dependencies]
# The system monitor alone (no PC Status connection, no self-update)
pcsc-rs = { git = "https://github.com/Zel9278/pcsc-rs", branch = "feat/library-monitor", default-features = false }
rosc = "=0.11.4"
serde_json = "=1.0.151"

[lints.clippy]
pedantic = "warn"

[profile.release]
strip = "symbols"
lto = "fat"
codegen-units = 1
